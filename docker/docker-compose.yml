name: openvpn

x-openvpn-image: &openvpn-image
  image: ${OPENVPN_IMAGE:-www.durian.fun:32433/openvpn-ui:v0.5.0}
  pull_policy: always

x-openvpn-volumes: &openvpn-volumes
  - ./data/openvpn:/etc/openvpn
  - ./data/db:/opt/openvpn-ui/db
  - ./data/log:/var/log/openvpn

services:
  init:
    <<: *openvpn-image
    command: ["init"]
    environment:
      OPENVPN_PUBLIC_HOST: ${OPENVPN_PUBLIC_HOST:?请在 .env 中设置 OPENVPN_PUBLIC_HOST}
      OPENVPN_PUBLIC_PORT: ${OPENVPN_PUBLIC_PORT:-1194}
      OPENVPN_PROTOCOL: ${OPENVPN_PROTOCOL:-tcp}
      OPENVPN_VPN_CIDR: ${OPENVPN_VPN_CIDR:-10.8.0.0/24}
      OPENVPN_LAN_CIDR: ${OPENVPN_LAN_CIDR:-192.168.18.0/24}
      OPENVPN_ADMIN_USERNAME: ${OPENVPN_ADMIN_USERNAME:-admin}
      OPENVPN_ADMIN_PASSWORD: ${OPENVPN_ADMIN_PASSWORD:?请在 .env 中设置 OPENVPN_ADMIN_PASSWORD}
      OPENVPN_MANAGEMENT_ADDRESS: 127.0.0.1:2080
    volumes: *openvpn-volumes
    restart: "no"

  openvpn:
    <<: *openvpn-image
    container_name: openvpn
    command: ["server"]
    environment:
      OPENVPN_NAT_INTERFACE: ${OPENVPN_NAT_INTERFACE:-}
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    network_mode: host
    volumes: *openvpn-volumes
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo quit | nc -w 2 127.0.0.1 2080 | grep -q 'OpenVPN Management'"]
      interval: 15s
      timeout: 5s
      retries: 5

  openvpn-ui:
    <<: *openvpn-image
    container_name: openvpn-ui
    command: ["ui"]
    environment:
      OPENVPN_ADMIN_USERNAME: ${OPENVPN_ADMIN_USERNAME:-admin}
      OPENVPN_ADMIN_PASSWORD: ${OPENVPN_ADMIN_PASSWORD:?请在 .env 中设置 OPENVPN_ADMIN_PASSWORD}
      OPENVPN_MANAGEMENT_ADDRESS: 127.0.0.1:2080
      UI_BIND_IP: ${UI_BIND_IP:-0.0.0.0}
      UI_PORT: ${UI_PORT:-8080}
      OPENVPN_UI_NETWORK_SCOPES: ${OPENVPN_UI_NETWORK_SCOPES:-}
      ALLOW_USER_MANAGEMENT: ${ALLOW_USER_MANAGEMENT:-false}
    cap_add:
      - NET_ADMIN
    volumes:
      - ./data/openvpn:/etc/openvpn
      - ./data/db:/opt/openvpn-ui/db
      - ./data/log:/var/log/openvpn
      - /var/run/docker.sock:/var/run/docker.sock:ro
    network_mode: host
    depends_on:
      openvpn:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://$${UI_BIND_IP}:$${UI_PORT}/login >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
