<!-- User Account Menu -->
<li class="dropdown user user-menu {{if compare .RouterPattern "/profile"}}active{{end}}">
  <!-- Menu Toggle Button -->
  <a href="#" class="nav-link dropdown-toggle" data-toggle="dropdown">
    <!-- The user image in the navbar-->
    <span class="admin-avatar"><img src="/static/img/person.png" alt=""></span>
    <!-- hidden-xs hides the username on small devices so only the image appears. -->
    <span class="admin-account-name">{{ .Userinfo.Name}}</span>
    <i class="fa fa-angle-down admin-account-chevron"></i>
  </a>
  <ul class="dropdown-menu">
    <!-- The user image in the menu -->
    <li class="user-header">
      <img src="/static/img/person.png" class="img-circle" alt="User Image">
      <p>
        {{ .Userinfo.Name}}
        <small><span data-i18n="Created on">Created on</span> {{ .Userinfo.Created.Format "Jan 02, 2006" }}</small>
      </p>
    </li>

    <!-- Menu Footer-->
    <li class="user-footer">
      <div class="pull-left">
        <a href="{{urlfor "ProfileController.Get"}}" class="btn btn-default btn-flat"><span data-i18n="Profile Configuration">Profile Configuration</span></a>
      </div>
      <div class="pull-right">
        <a href="{{urlfor "LoginController.Logout"}}" class="btn btn-default btn-flat"><span data-i18n="Sign out">Sign out</span></a>
      </div>
    </li>
  </ul>
</li>
